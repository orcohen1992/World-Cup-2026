<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מרכז מונדיאל 2026</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f0f0f0; }
    .header { background: #006d77; color: white; padding: 20px; text-align: center; }
    .section { background: white; margin: 20px 0; padding: 20px; border-radius: 10px; }
    .match { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; }
    .score { font-size: 1.5em; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1>מרכז מונדיאל 2026</h1>
    <p>אתר מלא, בעברית, מוכן למונדיאל 2026</p>
  </div>
  <div class="section">
    <h2>לוח משחקים</h2>
    <div class="match">
      <span>מקסיקו</span>
      <span class="score">2:1</span>
      <span>יפן</span>
    </div>
    <div class="match">
      <span>ארה"ב</span>
      <span class="score">1:1</span>
      <span>פרגוואי</span>
    </div>
  </div>
  <div class="section">
    <h2>טבלאות בתי נבחרות</h2>
    <p>בית א': מקסיקו, יפן, שבדיה, קמרון</p>
  </div>
  <div class="section">
    <h2>נבחרות וסגלים</h2>
    <p>ארגנטינה: א. מרטינס, רומרו, מקאליסטר</p>
  </div>
</body>
</html>
